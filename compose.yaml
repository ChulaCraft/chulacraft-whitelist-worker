services:
  minecraft:
    build: .
    image: local/paper-minecraft:1.21.11
    container_name: minecraft-paper
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${MINECRAFT_PORT:-25566}:25565"
      - "127.0.0.1:25575:25575"
      # Uncomment if you add Simple Voice Chat later.
      # - "24454:24454/udp"
    environment:
      TZ: "${TZ:-Asia/Bangkok}"
      MEMORY: "${MEMORY:-4G}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      RCON_PASSWORD: "${RCON_PASSWORD:-minecraft}"
      MOTD: "${MOTD:-Paper 1.21.11 Hard Survival}"
    volumes:
      - ./data:/data
      - ./plugins/modrinth-projects.txt:/extras/modrinth-projects.txt:ro
